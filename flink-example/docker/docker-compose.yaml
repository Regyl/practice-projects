services:
  fluent-bit:
    image: fluent/fluent-bit:latest
    volumes:
      - ./fluent-bit.yaml:/fluent-bit/etc/fluent-bit.yaml
    depends_on:
      kafka:
        condition: service_healthy
#    extra_hosts:
#      - "host.docker.internal:host-gateway"
    command: [ "/fluent-bit/bin/fluent-bit", "-c", "/fluent-bit/etc/fluent-bit.yaml" ]
    ports:
      - "2020:2020"
    networks:
      - main

  kafka:
    image: apache/kafka:4.4.0
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      # Use KRaft mode by setting process roles
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_NODE_ID=1
      # INTERNAL is for other containers (fluent-bit). EXTERNAL is published
      # as localhost:9092 so a job on the host is not told to reconnect to
      # the Compose-only name "kafka".
      - KAFKA_LISTENERS=INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      # Voters for the KRaft controller quorum
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      # A unique ID for the cluster
      - KAFKA_KRAFT_CLUSTER_ID=mkU3S9G9T2Ok_857_975_A
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 15s
      retries: 12
      start_period: 20s
    networks:
      - main

networks:
  main: