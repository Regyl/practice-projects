services:
  hadoop:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: hadoop-single-node
    hostname: hadoop-master  # 1. Force a fixed hostname
    extra_hosts:
      - "hadoop-master:127.0.0.1" # 2. Map the hostname to local loopback
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
      - hadoop_datanode:/hadoop/dfs/data
    environment:
      - CLUSTER_NAME=hadoop-cluster
      - CORE_CONF_fs_defaultFS=hdfs://hadoop-master:9000 # 3. Point HDFS to the fixed hostname
      - HDFS_CONF_dfs_replication=1
      - YARN_CONF_yarn_resourcemanager_hostname=hadoop-master # 4. Point YARN to the fixed hostname
      - YARN_CONF_yarn_nodemanager_vmem___check___enabled=false
    ports:
      - "9870:9870"
      - "9000:9000"
      - "8088:8088"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9870/"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  hadoop_namenode:
  hadoop_datanode:
