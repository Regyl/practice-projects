services:
  postgres:
    image: 'postgres:18.6'
    container_name: postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: 'user'
      POSTGRES_PASSWORD: 'pwd'
      POSTGRES_DB: 'db'
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

volumes:
  postgres_data: